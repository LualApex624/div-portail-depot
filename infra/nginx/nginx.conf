user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # Le token de depot vit dans le chemin de l'URL : le loguer en clair
  # reviendrait a deposer le premier facteur du split-secret dans un fichier
  # texte, lisible par quiconque a acces aux logs. On tronque donc /d/<token>.
  map $request_uri $safe_request_uri {
    ~^(/d/)[^/?]+(.*)$ "$1[redacted]$2";
    default            $request_uri;
  }

  log_format div_json escape=json
    '{"time":"$time_iso8601","remote":"$remote_addr","method":"$request_method",'
    '"uri":"$safe_request_uri","status":$status,"bytes":$body_bytes_sent,'
    '"duration":$request_time,"referer":"$http_referer","agent":"$http_user_agent"}';

  access_log /var/log/nginx/access.log div_json;

  sendfile on;
  keepalive_timeout 65;
  server_tokens off;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript;

  include /etc/nginx/conf.d/*.conf;
}
