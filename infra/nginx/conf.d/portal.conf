# Entree unique du portail en local.
#
# Une seule origine pour le front et l'API : les cookies de session sont donc
# same-site, il n'y a aucune preflight CORS a gerer, et le parcours navigateur
# est identique a ce qu'il serait derriere le proxy de production.

upstream div_api {
  server api:4000;
}

upstream div_web {
  server web:3000;
}

server {
  listen 80;
  server_name _;

  # 25 Mo par piece, plus une marge d'enveloppe HTTP.
  client_max_body_size 26m;

  # Entetes de securite. La CSP autorise le XHR vers le stockage objet, qui
  # est sur une autre origine : c'est le PUT presigne.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;

  # Ni les liens /d/:token ni le reste ne doivent finir dans un index public.
  add_header X-Robots-Tag "noindex, nofollow" always;

  location /api/ {
    proxy_pass http://div_api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  # Metriques et sondes : accessibles depuis le reseau Docker (Prometheus),
  # jamais publies vers l'exterieur.
  location /api/metrics {
    deny all;
    return 404;
  }

  location / {
    proxy_pass http://div_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
